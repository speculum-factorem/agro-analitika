# Прод-сервер: в .env задайте FRONTEND_PUBLISH_PORT=80 (или свой порт / reverse-proxy)
# Compose V2 (типично на Ubuntu с docker.io / Docker Engine): docker compose …
# docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Старый бинарь v1: docker-compose … (если установлен отдельно)
#
# Фронт наружу: в .env на проде задайте FRONTEND_PUBLISH_PORT=80 (или 443 за reverse-proxy).
# Блок frontend не переопределяем — иначе merge с базовым compose может дублировать ports.
services:
  # Keep gateway internal; frontend proxies /api -> api-gateway
  api-gateway:
    ports: []

  # Internal services should not be published to internet
  auth-service:
    ports: []
  field-service:
    ports: []
  weather-service:
    ports: []
  analytics-service:
    ports: []
  irrigation-service:
    ports: []
  notification-service:
    ports: []

  postgres:
    ports: []
  kafka:
    ports: []

  # Monitoring/UI are optional in production.
  # If needed, temporarily open and protect them by firewall/VPN.
  prometheus:
    ports: []
  grafana:
    ports: []
  kafka-ui:
    ports: []

